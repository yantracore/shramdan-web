<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Shramdan logo</title>
  <desc id="desc">An abstract civic tree holding traditional and modern tools for repairing society together.</desc>
  <defs>
    <linearGradient id="leafGradient" x1="108" x2="404" y1="90" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28a37f"/>
      <stop offset=".52" stop-color="#176b5c"/>
      <stop offset="1" stop-color="#0f4f44"/>
    </linearGradient>
    <linearGradient id="sunGradient" x1="176" x2="348" y1="134" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc85a"/>
      <stop offset=".52" stop-color="#f58f38"/>
      <stop offset="1" stop-color="#d8551a"/>
    </linearGradient>
    <linearGradient id="pathGradient" x1="90" x2="423" y1="414" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f4f44"/>
      <stop offset=".46" stop-color="#176b5c"/>
      <stop offset="1" stop-color="#5dbb9a"/>
    </linearGradient>
    <linearGradient id="toolRingGradient" x1="164" x2="350" y1="161" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7df" stop-opacity=".84"/>
      <stop offset=".48" stop-color="#fff1c2" stop-opacity=".46"/>
      <stop offset="1" stop-color="#fff7df" stop-opacity=".74"/>
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#fff6df" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fff0c6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#fff0c6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#17331f" flood-opacity=".16"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17331f" flood-opacity=".08"/>
    </filter>
    <filter id="innerLift" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f4f44" flood-opacity=".22"/>
    </filter>
  </defs>
  <style>
    #tool-plow,
    #tool-broom,
    #tool-wrench,
    #tool-laptop,
    #tool-flower {
      transform-box: fill-box;
      transform-origin: center;
      animation: tool-breathe 5.2s ease-in-out infinite;
    }

    #tool-flower { animation-name: flower-bloom; }
    #tool-plow { animation-delay: .05s; }
    #tool-wrench { animation-delay: .18s; }
    #tool-laptop { animation-delay: .31s; }
    #tool-broom { animation-delay: .44s; }

    #shared-heart {
      transform-box: fill-box;
      transform-origin: center;
      animation: heart-pulse 3.6s ease-in-out infinite;
    }

    #organic-tool-ring {
      stroke-dasharray: 620;
      stroke-dashoffset: 620;
      animation: ring-draw 2.8s ease-out forwards, ring-breathe 6s ease-in-out 2.8s infinite;
    }

    @keyframes ring-draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes ring-breathe {
      0%, 100% { opacity: .72; }
      50% { opacity: .95; }
    }

    @keyframes tool-breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.035); }
    }

    @keyframes flower-bloom {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.08); }
    }

    @keyframes heart-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @media (prefers-reduced-motion: reduce) {
      #tool-plow,
      #tool-broom,
      #tool-wrench,
      #tool-laptop,
      #tool-flower,
      #shared-heart,
      #organic-tool-ring {
        animation: none;
      }
      #organic-tool-ring {
        stroke-dashoffset: 0;
      }
    }
  </style>

  <circle cx="256" cy="256" r="226" fill="url(#glowGradient)"/>

  <g filter="url(#softShadow)">
    <path
      fill="url(#pathGradient)"
      d="M256 57c53 37 97 88 132 153 33 61 51 127 55 198-68-9-130-31-185-67-57-37-102-84-135-141 35-58 79-106 133-143Z"
      opacity=".98"
    />
    <path
      fill="#f7f5ef"
      fill-opacity=".95"
      d="M256 92c42 31 77 72 105 123 24 44 39 91 46 141-47-11-91-30-130-57-44-30-80-67-107-112 26-38 55-69 86-95Z"
      opacity=".16"
    />
    <path
      fill="url(#leafGradient)"
      d="M253 66c-48 39-88 89-119 151-29 59-46 123-50 191 65-9 126-30 180-64 56-36 101-82 134-136-34-59-82-106-145-142Z"
    />
    <path
      fill="#fbfaf4"
      fill-opacity=".16"
      d="M252 103c-38 32-69 72-94 121-21 42-34 86-39 132 46-10 89-29 128-55 42-28 76-65 102-108-26-36-58-66-97-90Z"
    />
  </g>

  <g filter="url(#innerLift)">
    <path
      fill="#fbfaf4"
      d="M256 146c25 0 48 7 68 19-19 18-41 32-68 42-27-10-49-24-68-42 20-12 43-19 68-19Z"
    />
    <path
      fill="#fbfaf4"
      d="M151 251c0-25 7-49 20-69 18 20 32 43 42 70-10 26-24 48-42 67-13-20-20-43-20-68Z"
    />
    <path
      fill="#fbfaf4"
      d="M361 251c0-25-7-49-20-69-18 20-32 43-42 70 10 26 24 48 42 67 13-20 20-43 20-68Z"
    />
    <path
      fill="#fbfaf4"
      d="M256 356c25 0 48-7 68-20-19-18-41-31-68-41-27 10-49 23-68 41 20 13 43 20 68 20Z"
    />
  </g>

  <g filter="url(#innerLift)">
    <circle cx="256" cy="252" r="72" fill="url(#sunGradient)"/>
    <path
      fill="#fff7df"
      d="M256 188c20 20 40 33 65 42-11 30-27 50-65 85-38-35-54-55-65-85 25-9 45-22 65-42Z"
      opacity=".18"
    />
    <path
      id="organic-tool-ring"
      fill="none"
      stroke="url(#toolRingGradient)"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="8"
      d="M256 171c24 2 44 9 58 23 21 1 35 12 41 31 11 17 10 37-3 57-4 21-17 36-38 44-18 14-39 17-62 10-23 7-44 4-62-10-21-8-34-23-38-44-13-20-14-40-3-57 6-19 20-30 41-31 15-14 35-21 66-23Z"
      opacity=".82"
    />

    <g id="tool-flower" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M256 216v-27" stroke="#176b5c" stroke-width="7"/>
      <path d="M256 187c-12-14-10-29 0-42 10 13 12 28 0 42Z" fill="#fff7df"/>
      <path d="M256 186c-17-7-24-20-22-35 15 5 25 17 22 35Z" fill="#fff7df" opacity=".92"/>
      <path d="M256 186c17-7 24-20 22-35-15 5-25 17-22 35Z" fill="#fff7df" opacity=".92"/>
      <circle cx="256" cy="187" r="5" fill="#176b5c" stroke="none"/>
    </g>

    <g id="tool-plow" fill="none" stroke="#fff7df" stroke-linecap="round" stroke-linejoin="round">
      <path d="M211 211 247 247" stroke-width="10"/>
      <path d="M207 213c-16 6-24 18-26 34 16-3 28-11 34-27" stroke-width="8"/>
      <path d="M224 224c7-13 18-19 33-18" stroke-width="7"/>
    </g>

    <g id="tool-wrench" fill="#176b5c">
      <circle cx="329" cy="229" r="10"/>
      <path d="M314 197c8-9 22-10 32-3l-15 15 11 11 15-15c7 11 5 25-5 34-10 9-25 9-35 0l-38 38-13-13 39-38c-6-10-4-20 9-29Z"/>
      <circle cx="275" cy="268" r="4" fill="#fff7df"/>
    </g>

    <g id="tool-laptop" fill="#176b5c">
      <rect x="218" y="289" width="76" height="44" rx="8"/>
      <rect x="207" y="333" width="98" height="11" rx="6"/>
      <path d="M234 300h44v23h-44z" fill="#fff7df" opacity=".92"/>
      <path d="M245 315h22" stroke="#176b5c" stroke-linecap="round" stroke-width="5"/>
    </g>

    <g id="tool-broom" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M303 303 333 273" stroke="#fff7df" stroke-width="9"/>
      <path d="M329 269c11 3 19 12 22 24-13 2-25-1-34-9" stroke="#fff7df" stroke-width="7"/>
      <path d="M323 290 345 312M333 282l24 18M315 297l18 25" stroke="#176b5c" stroke-width="5"/>
    </g>

    <circle id="shared-heart" cx="256" cy="252" r="18" fill="#176b5c"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M141 384c48-14 87-35 115-66 28 31 67 52 115 66" stroke="#0f4f44" stroke-width="20" opacity=".92"/>
    <path d="M179 407c25-7 51-18 77-34 26 16 52 27 77 34" stroke="#f58f38" stroke-width="12" opacity=".96"/>
    <path d="M256 111v72" stroke="#fff4d4" stroke-width="15" opacity=".9"/>
  </g>
</svg>
