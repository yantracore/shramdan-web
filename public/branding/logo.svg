<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Shramdan logo</title>
  <desc id="desc">An abstract civic mark showing four community paths gathering around a shared seed of action.</desc>
  <defs>
    <linearGradient id="leafGradient" x1="108" x2="404" y1="90" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28a37f"/>
      <stop offset=".52" stop-color="#176b5c"/>
      <stop offset="1" stop-color="#0f4f44"/>
    </linearGradient>
    <linearGradient id="sunGradient" x1="176" x2="348" y1="134" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc85a"/>
      <stop offset=".52" stop-color="#f58f38"/>
      <stop offset="1" stop-color="#d8551a"/>
    </linearGradient>
    <linearGradient id="pathGradient" x1="90" x2="423" y1="414" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f4f44"/>
      <stop offset=".46" stop-color="#176b5c"/>
      <stop offset="1" stop-color="#5dbb9a"/>
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#fff6df" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fff0c6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#fff0c6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#17331f" flood-opacity=".16"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17331f" flood-opacity=".08"/>
    </filter>
    <filter id="innerLift" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f4f44" flood-opacity=".22"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="226" fill="url(#glowGradient)"/>

  <g filter="url(#softShadow)">
    <path
      fill="url(#pathGradient)"
      d="M256 57c53 37 97 88 132 153 33 61 51 127 55 198-68-9-130-31-185-67-57-37-102-84-135-141 35-58 79-106 133-143Z"
      opacity=".98"
    />
    <path
      fill="#f7f5ef"
      fill-opacity=".95"
      d="M256 92c42 31 77 72 105 123 24 44 39 91 46 141-47-11-91-30-130-57-44-30-80-67-107-112 26-38 55-69 86-95Z"
      opacity=".16"
    />
    <path
      fill="url(#leafGradient)"
      d="M253 66c-48 39-88 89-119 151-29 59-46 123-50 191 65-9 126-30 180-64 56-36 101-82 134-136-34-59-82-106-145-142Z"
    />
    <path
      fill="#fbfaf4"
      fill-opacity=".16"
      d="M252 103c-38 32-69 72-94 121-21 42-34 86-39 132 46-10 89-29 128-55 42-28 76-65 102-108-26-36-58-66-97-90Z"
    />
  </g>

  <g filter="url(#innerLift)">
    <path
      fill="#fbfaf4"
      d="M256 146c25 0 48 7 68 19-19 18-41 32-68 42-27-10-49-24-68-42 20-12 43-19 68-19Z"
    />
    <path
      fill="#fbfaf4"
      d="M151 251c0-25 7-49 20-69 18 20 32 43 42 70-10 26-24 48-42 67-13-20-20-43-20-68Z"
    />
    <path
      fill="#fbfaf4"
      d="M361 251c0-25-7-49-20-69-18 20-32 43-42 70 10 26 24 48 42 67 13-20 20-43 20-68Z"
    />
    <path
      fill="#fbfaf4"
      d="M256 356c25 0 48-7 68-20-19-18-41-31-68-41-27 10-49 23-68 41 20 13 43 20 68 20Z"
    />
  </g>

  <g filter="url(#innerLift)">
    <circle cx="256" cy="251" r="61" fill="url(#sunGradient)"/>
    <path
      fill="#fff7df"
      d="M256 207c15 24 31 40 55 55-24 15-40 31-55 55-15-24-31-40-55-55 24-15 40-31 55-55Z"
      opacity=".95"
    />
    <circle cx="256" cy="262" r="21" fill="#176b5c"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M141 384c48-14 87-35 115-66 28 31 67 52 115 66" stroke="#0f4f44" stroke-width="20" opacity=".92"/>
    <path d="M179 407c25-7 51-18 77-34 26 16 52 27 77 34" stroke="#f58f38" stroke-width="12" opacity=".96"/>
    <path d="M256 111v72" stroke="#fff4d4" stroke-width="15" opacity=".9"/>
  </g>
</svg>
