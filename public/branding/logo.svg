<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Shramdan logo</title>
  <desc id="desc">An abstract civic tree holding traditional and modern tools for repairing society together.</desc>
  <defs>
